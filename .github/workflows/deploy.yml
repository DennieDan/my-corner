name: Release website to dandinh.net

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'public/**'
      - 'styles/**'
      - 'tests/chat-widget.test.tsx'
      - 'infrastructure/scripts/release.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - '.github/workflows/deploy.yml'

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      NEXT_PUBLIC_AGENT_API_URL: ${{ vars.NEXT_PUBLIC_AGENT_API_URL }}
      DENNIE_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix infrastructure
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::520070583275:role/GitHubActionsMyCornerRole
          aws-region: ap-southeast-1
      - name: Build, deploy, and smoke test
        run: npm run release:website
      - name: Save rollback record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-release-record
          path: .releases/website-production-*.json
          if-no-files-found: ignore
