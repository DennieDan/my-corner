name: Deploy Next.js to AWS S3 & CloudFront

on:
  push:
    branches:
      - main # Triggers the build whenever you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    # This permission is required for requesting the JWT OIDC token
    permissions:
      id-token: write
      contents: read
    env:
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      # 1. Checkout your code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v5

      # 2. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # 3. Install dependencies and build Next.js static files
      - name: Install and Build
        env:
          NEXT_PUBLIC_VOICEFLOW_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_VOICEFLOW_PROJECT_ID }}
        run: |
          npm ci
          npm run build

      # 4. Configure AWS Credentials using your GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::520070583275:role/GitHubActionsMyCornerRole
          aws-region: ap-southeast-1

      # 5. Sync the 'out' folder contents to your S3 bucket
      - name: Deploy to S3
        run: aws s3 sync ./out "s3://${S3_BUCKET_NAME}" --delete

      # 6. Tell CloudFront to clear its cache so visitors see the new blog immediately
      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
