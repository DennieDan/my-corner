name: Deploy Lambda

on:
  push:
    branches: [main]
    paths:
      - "lambda/**"
      - ".github/workflows/deploy-lambda.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Required for OIDC: configure-aws-credentials needs a JWT from GitHub.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Package Lambda
        run: |
          cd lambda/delete-voiceflow-state
          zip -j function.zip index.mjs

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::520070583275:role/GitHubActionsMyCornerRole
          aws-region: ap-southeast-1

      - name: Deploy Lambda
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_DELETE_STATE_FUNCTION_NAME }}
          VOICEFLOW_API_KEY: ${{ secrets.VOICEFLOW_API_KEY }}
          NEXT_PUBLIC_VOICEFLOW_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_VOICEFLOW_PROJECT_ID }}
          ALLOWED_ORIGINS: ${{ vars.LAMBDA_ALLOWED_ORIGINS }}
        run: |
          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --zip-file fileb://lambda/delete-voiceflow-state/function.zip

          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION_NAME}"

          # Use JSON so ALLOWED_ORIGINS can contain commas (multiple origins).
          ENV_JSON=$(jq -n \
            --arg projectId "${NEXT_PUBLIC_VOICEFLOW_PROJECT_ID}" \
            --arg apiKey "${VOICEFLOW_API_KEY}" \
            --arg allowedOrigins "${ALLOWED_ORIGINS}" \
            '{
              Variables: {
                NEXT_PUBLIC_VOICEFLOW_PROJECT_ID: $projectId,
                VOICEFLOW_API_KEY: $apiKey,
                NEXT_PUBLIC_VERSION_ID: "main",
                ALLOWED_ORIGINS: $allowedOrigins
              }
            }')

          aws lambda update-function-configuration \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --environment "${ENV_JSON}"
